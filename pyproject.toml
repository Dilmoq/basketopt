[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basketopt"
version = "0.1.0"
description = "Grocery basket optimizer: find the cheapest way to buy your list across stores, including delivery fees"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dilmoq" }]
keywords = ["grocery", "prices", "optimizer", "basket", "shopping", "magnit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.scripts]
basketopt = "basketopt.cli:main"


[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["B008"]
